services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dotaznik
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dotaznik
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dotaznik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
